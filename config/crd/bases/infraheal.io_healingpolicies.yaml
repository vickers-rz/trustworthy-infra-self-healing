apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: healingpolicies.infraheal.io
spec:
  group: infraheal.io
  scope: Namespaced
  names:
    plural: healingpolicies
    singular: healingpolicy
    kind: HealingPolicy
    shortNames:
      - hp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.target.name
        - name: Found
          type: boolean
          jsonPath: .status.targetFound
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Desired
          type: integer
          jsonPath: .status.desiredReplicas
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - target
              properties:
                target:
                  type: object
                  required:
                    - name
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                      minLength: 1
                mode:
                  type: string
                  default: Observe
                  enum:
                    - Observe
                observeIntervalSeconds:
                  type: integer
                  format: int32
                  default: 30
                  minimum: 5
                  maximum: 3600
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                targetFound:
                  type: boolean
                desiredReplicas:
                  type: integer
                  format: int32
                availableReplicas:
                  type: integer
                  format: int32
                readyReplicas:
                  type: integer
                  format: int32
                updatedReplicas:
                  type: integer
                  format: int32
                lastObservedTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
