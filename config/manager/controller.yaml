apiVersion: v1
kind: Namespace
metadata:
  name: infraheal-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraheal-controller
  namespace: infraheal-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infraheal-healingpolicy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infraheal-healingpolicy-controller
subjects:
  - kind: ServiceAccount
    name: infraheal-controller
    namespace: infraheal-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraheal-controller
  namespace: infraheal-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infraheal-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infraheal-controller
    spec:
      serviceAccountName: infraheal-controller
      automountServiceAccountToken: true
      containers:
        - name: controller
          image: infraheal-controller:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --leader-elect=false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 5
