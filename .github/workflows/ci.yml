name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Generate Kubernetes artifacts
        run: |
          make manifests
          make generate
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: controller-generated
          path: |
            api/v1alpha1/zz_generated.deepcopy.go
            config/crd/bases
            config/rbac
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
