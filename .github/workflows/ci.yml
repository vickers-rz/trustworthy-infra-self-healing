name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Tidy modules
        run: go mod tidy
      - name: Upload module graph
        uses: actions/upload-artifact@v4
        with:
          name: module-files
          path: |
            go.mod
            go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
