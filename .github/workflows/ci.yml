name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify generated Kubernetes artifacts
        run: make verify-generated
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  kind-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind v0.32.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" | sha256sum --check
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl v1.34.8
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            https://dl.k8s.io/release/v1.34.8/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl.sha256 \
            https://dl.k8s.io/release/v1.34.8/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Create Kubernetes 1.34 Kind cluster
        run: |
          kind create cluster \
            --name infraheal-e2e \
            --image kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256 \
            --wait 120s

      - name: Build and load observe-only controller
        run: |
          docker build -f Dockerfile.controller -t infraheal-controller:e2e .
          kind load docker-image infraheal-controller:e2e --name infraheal-e2e

      - name: Run observe-only integration test
        run: bash test/e2e/kind-observe.sh

      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl get healingpolicies.infraheal.io -A -o yaml || true
          kubectl logs -n infraheal-system deployment/infraheal-controller || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name infraheal-e2e
